<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Similarity Map</title>
<meta name="description" content="Explore visual similarities between 41 composite portraits with FaceNet embeddings, clusters, and a nearest-neighbor graph on a world map.">
<meta name="theme-color" content="#243c38">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<style>
:root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#242b30;background:#f6f5f1}*{box-sizing:border-box}body{margin:0}header{padding:22px 32px;border-bottom:1px solid #deded8}h1{font-size:28px;font-weight:620;letter-spacing:-1px;margin:0}.cluster-control{display:flex;align-items:center;gap:6px}.cluster-step{width:30px;height:31px;padding:0;font-size:17px;line-height:1}.cluster-step:disabled{opacity:.35;cursor:default}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 24px;background:#eeeee8;font-size:12px}label{display:flex;gap:8px;align-items:center}select,input,button{font:inherit}select,button{padding:7px 9px;border:1px solid #cccfc7;border-radius:6px;background:#fff}button{cursor:pointer}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;max-width:1600px;margin:auto}#map{width:100%;height:auto;min-height:600px;display:block;touch-action:none}.node,.geo-anchor{cursor:pointer}.node:focus{outline:none}.node:focus .photo-frame,.node:hover .photo-frame{stroke:#697780;stroke-width:1.5}.cluster-hull{stroke-linejoin:round}.cluster-label text{font-size:11px;font-weight:600;letter-spacing:.05px}.selected-copy{min-width:0}.cluster-name{display:block;font-size:11px;line-height:1.4;color:#737b76;margin-top:5px}aside{padding:24px 20px;border-left:1px solid #deded8}h2{font-size:17px;margin:0 0 18px}.selected{display:flex;align-items:center;gap:13px;margin-bottom:20px}.selected img{width:96px;height:96px;border-radius:14px}.selected strong{font-size:18px;min-width:0;overflow-wrap:anywhere;line-height:1.3}.map-figure{min-width:0;margin:0}.caption{font-size:11px;line-height:1.7;color:#79817c;padding:16px 24px 20px}.caption p{margin:0 0 7px}.caption p:last-child{margin:0}.caption strong{font-weight:600;color:#606d65}.caption a{color:#69796f;text-underline-offset:2px}.link-legend{display:flex;align-items:center;gap:6px;font-size:10px;color:#65736b}.link-legend[hidden]{display:none}.legend-ramp{width:85px;height:7px;border-radius:3px}.metric{font-size:11px;color:#737b76;margin:0 0 9px}.neighbor{position:relative;overflow:hidden;display:flex;width:100%;align-items:center;gap:10px;margin:8px 0;text-align:left;padding:7px 8px;border-color:#e1e2dc;border-radius:9px;background:#fbfbf8}.sidebar-portrait{display:inline-flex;flex:0 0 auto;align-items:center;gap:6px}.sidebar-portrait::before{content:"";display:block;align-self:stretch;flex:0 0 4px;border-radius:2px;background:var(--cluster-color)}.sidebar-portrait img{display:block;flex:0 0 auto}.neighbor img{width:44px;height:44px;border-radius:9px}.neighbor span{flex:1;font-size:12px}.neighbor b{font-size:15px}@media(max-width:850px){header{padding:20px}h1{font-size:25px}.toolbar{padding:12px 20px;gap:10px}main{grid-template-columns:1fr}#map{min-height:0}aside{border-left:0;border-top:1px solid #deded8}}
</style>
<header><h1>Face Similarity Map</h1></header>
<main>
<figure class="map-figure">
<svg id="map" viewBox="-60 -35 1220 720" aria-label="World map of face similarities"></svg>
<div class="toolbar" aria-label="Map options">
<div class="cluster-control"><label for="k">Clusters</label><button id="kMinus" class="cluster-step" type="button" aria-label="Decrease cluster count">−</button><select id="k" aria-label="Number of clusters"></select><button id="kPlus" class="cluster-step" type="button" aria-label="Increase cluster count">＋</button></div>
<label>Face size <input id="size" type="range" min="26" max="99" value="48" aria-label="Face size"></label>
<label><input id="labels" type="checkbox" checked>Labels</label>
<label><input id="repel" type="checkbox" checked>Avoid overlap</label>
<label><input id="hulls" type="checkbox" checked>Cluster hulls</label>
<label>Links <select id="edges" aria-label="Number of similarity links"><option value="3">3</option><option value="5" selected>5</option><option value="10">10</option></select></label>
<label><input id="worldphotos" type="checkbox" checked>Show faces</label>
<label><input id="nearestGraph" type="checkbox">Nearest-neighbor graph</label>
<div id="linkLegend" class="link-legend" hidden><span>Cosine similarity</span><span id="legendLow"></span><span id="legendRamp" class="legend-ramp"></span><span id="legendHigh"></span></div>
</div>
<figcaption class="caption">
<p><strong>Images.</strong> Composite portraits made with the FaceResearch.org averaging tool. Source: <a href="https://pmsol3.wordpress.com/2009/10/10/world-of-facial-averages-east-southeast-asia-pacific-islander/" target="_blank" rel="noopener noreferrer">The Postnational Monitor · World of Averages</a> · <a href="https://feministphilosophers.wordpress.com/2011/02/06/the-average-face-of-women-across-the-world/#comment-30613" target="_blank" rel="noopener noreferrer">Provenance</a>.</p>
<p><strong>Method.</strong> Fixed-region crops → FaceNet (InceptionResnetV1 · VGGFace2), 512D embeddings → cosine similarity → average-linkage agglomerative clustering.</p>
<p class="design-credit">Design by <a href="https://x.com/taekie" target="_blank" rel="noopener noreferrer">@taekie</a></p>
</figcaption>
</figure>
<aside id="nearestFaces" hidden><h2>Nearest faces</h2><div id="selection"></div></aside>
</main>
<script>__D3_BUNDLE__</script>
<script>
const D=__ANALYSIS_DATA__;
const WORLD=__WORLD_DATA__,GEO=__GEOGRAPHY_DATA__;
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
let selected=7,selectionActive=false,linksVisible=false;
for(let k=2;k<=15;k++)$('k').add(new Option(`${k}${k===D.default_k?' · default':''}`,k));
$('k').value=D.default_k;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e;}
function select(i){selected=i;selectionActive=true;linksVisible=!$('nearestGraph').checked;render();}
function clearLinks(){if(!selectionActive&&!linksVisible&&!$('nearestGraph').checked)return;selectionActive=false;linksVisible=false;$('nearestGraph').checked=false;render();}
function sidebar(){
 $('nearestFaces').hidden=!selectionActive;
 if(!selectionActive){$('selection').replaceChildren();return;}
 const r=D.records[selected],assignment=D.clusters[$('k').value];
 $('selection').innerHTML=`<div class="selected" style="--cluster-color:${D.colors[assignment[selected]]}" title="Cluster ${assignment[selected]+1} · ${D.cluster_info[$('k').value][assignment[selected]].name}"><div class="sidebar-portrait"><img src="${r.image}" alt="${r.label}"></div><div class="selected-copy"><strong>${r.label}</strong><span class="cluster-name">${D.cluster_info[$('k').value][assignment[selected]].name}</span></div></div><p class="metric">Cosine similarity</p>`;
 r.neighbors.forEach(n=>{
  const q=D.records[n.id],b=document.createElement('button');b.className='neighbor';
  b.style.setProperty('--cluster-color',D.colors[assignment[n.id]]);b.dataset.cluster=assignment[n.id]+1;b.title=`Cluster ${assignment[n.id]+1} · ${D.cluster_info[$('k').value][assignment[n.id]].name}`;
  b.innerHTML=`<div class="sidebar-portrait"><img src="${q.image}" alt=""></div><span>${q.label}</span><b>${n.cosine_similarity.toFixed(3)}</b>`;
  b.onclick=e=>{e.stopPropagation();select(n.id);};$('selection').appendChild(b);
 });
}
function render(){
 const k=+$('k').value;$('kMinus').disabled=k<=2;$('kPlus').disabled=k>=15;
 $('edges').disabled=$('nearestGraph').checked;
 $('linkLegend').hidden=!(linksVisible||$('nearestGraph').checked);
 $('legendLow').textContent=LINK_COLOR_DOMAIN[0].toFixed(2);$('legendHigh').textContent=LINK_COLOR_DOMAIN[1].toFixed(2);
 $('legendRamp').style.background=`linear-gradient(to right,${d3.range(0,1.01,.1).map(t=>d3.interpolateYlGnBu(t)).join(',')})`;
 renderWorld();
}
function stepClusters(delta){const value=+$('k').value,next=Math.max(2,Math.min(15,value+delta));if(next!==value){$('k').value=next;render();}}
$('nearestGraph').onchange=()=>{linksVisible=false;render();};
$('kMinus').onclick=()=>stepClusters(-1);
$('kPlus').onclick=()=>stepClusters(1);
['k','size','labels','repel','hulls','edges','worldphotos'].forEach(id=>{const e=$(id);e.addEventListener(e.tagName==='SELECT'||e.type==='checkbox'?'change':'input',render);});
</script>
<script>__WORLD_BUNDLE__</script>
<script>
document.addEventListener('click',e=>{
 if(!e.target.closest('.node,.geo-anchor,.geo-marker,.neighbor,.toolbar,aside'))clearLinks();
});
render();
</script></html>
